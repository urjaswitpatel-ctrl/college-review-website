<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CampusVoice</title>

  <style>

    body{
      font-family: Arial;
      background:#f2f5ff;
      margin:0;
      padding:0;
    }

    header{
      background:#1e40af;
      color:white;
      text-align:center;
      padding:20px;
    }

    .container{
      width:90%;
      max-width:900px;
      margin:auto;
      margin-top:30px;
    }

    .form-box,
    .review-card{

      background:white;

      padding:20px;

      border-radius:10px;

      margin-bottom:20px;

      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    input,
    textarea,
    select{

      width:100%;

      padding:10px;

      margin-top:10px;

      margin-bottom:15px;

      border:1px solid #ccc;

      border-radius:6px;

      box-sizing:border-box;
    }

    textarea{
      min-height:120px;
    }

    button{

      background:#2563eb;

      color:white;

      border:none;

      padding:12px 20px;

      border-radius:6px;

      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    .stars{
      color:orange;
      font-size:18px;
    }

  </style>

</head>

<body>

<header>

  <h1>CampusVoice</h1>

  <p>Student College Reviews</p>

</header>

<div class="container">

  <div class="form-box">

    <h2>Post Review</h2>

    <input
      type="text"
      id="collegeName"
      placeholder="College Name"
    >

    <input
      type="text"
      id="reviewerName"
      placeholder="Your Name"
    >

    <select id="rating">

      <option value="">Select Rating</option>

      <option value="5">5 Stars</option>

      <option value="4">4 Stars</option>

      <option value="3">3 Stars</option>

      <option value="2">2 Stars</option>

      <option value="1">1 Star</option>

    </select>

    <textarea
      id="reviewText"
      placeholder="Write your review"
    ></textarea>

    <button onclick="addReview()">
      Submit Review
    </button>

  </div>

  <h2>All Reviews</h2>

  <div id="reviewsContainer"></div>

</div>


<!-- FIREBASE SCRIPT -->

<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getDatabase,
    ref,
    push,
    onValue
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  // PASTE YOUR FIREBASE CONFIG HERE

 const firebaseConfig = {
  apiKey: "AIzaSyAKqsWATk0mdpfoyc-7SOkLRMob4Zaj__U",
  authDomain: "campusvoice-21170.firebaseapp.com",
  databaseURL: "https://campusvoice-21170-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "campusvoice-21170",
  storageBucket: "campusvoice-21170.firebasestorage.app",
  messagingSenderId: "1009764911560",
  appId: "1:1009764911560:web:9544145427c0e8ecf918fd"
};


  // INITIALIZE FIREBASE

  const app = initializeApp(firebaseConfig);

  const db = getDatabase(app);


  // ADD REVIEW FUNCTION

  function addReview(){

    const college =
      document.getElementById("collegeName").value;

    const name =
      document.getElementById("reviewerName").value;

    const rating =
      document.getElementById("rating").value;

    const text =
      document.getElementById("reviewText").value;


    if(!college || !name || !rating || !text){

      alert("Please fill all fields");

      return;
    }


    push(ref(db, "reviews"), {

      college: college,

      name: name,

      rating: rating,

      text: text

    });


    alert("Review Added");


    // CLEAR INPUTS

    document.getElementById("collegeName").value = "";

    document.getElementById("reviewerName").value = "";

    document.getElementById("rating").value = "";

    document.getElementById("reviewText").value = "";

  }


  // MAKE FUNCTION GLOBAL

  window.addReview = addReview;


  // LOAD REVIEWS LIVE

  const reviewsContainer =
    document.getElementById("reviewsContainer");


  onValue(ref(db, "reviews"), (snapshot)=>{

    reviewsContainer.innerHTML = "";


    snapshot.forEach((childSnapshot)=>{

      const review = childSnapshot.val();


      reviewsContainer.innerHTML += `

        <div class="review-card">

          <h3>${review.college}</h3>

          <p><b>${review.name}</b></p>

          <p class="stars">
            ${"⭐".repeat(review.rating)}
          </p>

          <p>${review.text}</p>

        </div>

      `;

    });

  });

</script>

</body>

</html>
